services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gigscanner
      POSTGRES_PASSWORD: gigscanner
      POSTGRES_DB: gigscanner
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigscanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in .env so the backend always
      # talks to the compose postgres service by its service name.
      DATABASE_URL: postgresql://gigscanner:gigscanner@db:5432/gigscanner
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      # Reuses the Gmail OAuth token generated by the one-time host auth
      # flow (README step 3c) instead of redoing browser auth in-container.
      - ${HOME}/.gmail-mcp:/root/.gmail-mcp

  frontend:
    build: ./Frontend/gig-scanner-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend/gig-scanner-ui:/app
      - /app/node_modules

volumes:
  pgdata:
